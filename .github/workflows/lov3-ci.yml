name: LOV3 integrity checks

on:
  pull_request:
    paths:
      - 'lov3/**'
      - 'index.html'
      - '.github/workflows/lov3-ci.yml'
  push:
    branches:
      - feature/lov3-genesis-foundation
    paths:
      - 'lov3/**'
      - 'index.html'
      - '.github/workflows/lov3-ci.yml'

permissions:
  contents: read

concurrency:
  group: lov3-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  continuity-and-graph:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        run: |
          for file in lov3/*.mjs lov3/memory/*.mjs; do
            node --check "$file"
          done
      - name: Verify TRUST33 continuity wake
        run: |
          node lov3/memory/wake.mjs > /tmp/lov3-wake.txt
          grep -q 'TRUST33' /tmp/lov3-wake.txt
          grep -q '346 IS LIF3' /tmp/lov3-wake.txt
          grep -q 'Collaborator perspective' /tmp/lov3-wake.txt
      - name: Validate actual project memory and Genesis
        run: |
          node lov3/memory/bootstrap.mjs > /tmp/lov3-context.txt
          grep -q '346 IS LIF3' /tmp/lov3-context.txt
          grep -q 'Genesis entries:' /tmp/lov3-context.txt
          grep -q 'Publication status:' /tmp/lov3-context.txt
          grep -q 'Engineering rationale' /tmp/lov3-context.txt
      - name: Run complete LOV3 Node.js test suite
        run: node --test lov3/*.test.mjs lov3/memory/*.test.mjs
